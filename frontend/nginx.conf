server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Repli pour application monopage.
    #
    # Vue Router utilise l'historique du navigateur : /documents/42 est une route
    # CLIENTE, aucun fichier ne porte ce nom. Sans cette ligne, nginx renvoie 404
    # dès qu'on recharge la page ou qu'on ouvre un lien direct — l'application
    # ne fonctionne qu'en navigation interne, ce qui se remarque tard.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ATTENTION À UNE RÈGLE D'HÉRITAGE DE NGINX, vérifiée sur conteneur lancé.
    #
    # Les `add_header` d'un niveau ne sont hérités que si le niveau courant n'en
    # déclare AUCUN. Dès qu'un bloc `location` ajoute un en-tête, il perd tous
    # ceux du bloc `server`. Les en-têtes de sécurité ci-dessous disparaissaient
    # ainsi de la réponse sur / et sur les fichiers de /assets/ — c'est-à-dire
    # sur toutes les pages réellement servies.
    #
    # Ils sont donc répétés dans chaque bloc qui déclare un en-tête. Dupliquer
    # est ici la correction, pas un oubli de factorisation.

    # Les fichiers produits par Vite portent une empreinte dans leur nom
    # (index-DI3XYKwO.css) : leur contenu ne change jamais sous un même nom, ils
    # peuvent donc être mis en cache indéfiniment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html, lui, ne doit JAMAIS être mis en cache : c'est lui qui désigne
    # les fichiers empreintés. S'il est gardé, le navigateur continue de demander
    # l'ancienne version du site après un déploiement.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # En-têtes de sécurité élémentaires. Pas de Content-Security-Policy ici :
    # elle demande un inventaire précis des sources autorisées, qui dépasse la
    # mise en conteneur et figure dans la TODO.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
