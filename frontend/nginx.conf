server {
    # 8080 : l'image tourne sous un utilisateur non privilégié, qui ne peut pas
    # se lier à un port inférieur à 1024. Voir frontend/Dockerfile.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── L'API, servie sous la MÊME origine que l'interface ──────────────────
    #
    # POURQUOI CE BLOC EXISTE. src/services/api.ts utilise « baseURL: "/api" »,
    # une URL RELATIVE. Sans ce bloc, /api/auth/login tombait dans le
    # « location / » ci-dessous, donc dans try_files, qui renvoyait index.html :
    # chaque appel d'API recevait une page HTML au lieu de JSON. L'application
    # fonctionnait en développement — vite.config.ts déclare le même proxy — et
    # seulement là.
    #
    # LA BARRE FINALE DE proxy_pass N'EST PAS DÉCORATIVE. Avec « backend:5000/ »
    # nginx retire le préfixe de location : /api/auth/login devient
    # /auth/login côté Flask, qui est bien le chemin déclaré par le blueprint
    # (url_prefix="/auth"). Sans cette barre, Flask recevrait /api/auth/login
    # et répondrait 404 sur toutes les routes.
    #
    # CE QUE CELA APPORTE EN PLUS. L'interface et l'API partagent désormais une
    # seule origine et un seul port. Il n'y a donc plus de requête inter-origine,
    # donc plus de préflight CORS, et surtout plus aucune URL absolue figée dans
    # le bundle : le site fonctionne à l'identique sur localhost, sur une IP de
    # réseau local ou derrière un nom de domaine, sans reconstruire l'image.
    location /api/ {
        proxy_pass http://backend:5000/;
        proxy_http_version 1.1;

        # L'hôte réel est transmis au backend : sans cela, Flask ne voit que
        # « backend » et construit de mauvaises URL absolues (courriels de
        # réinitialisation, redirections).
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 600 s, et non les 60 s par défaut de nginx. Une génération par Ollama
        # dépasse régulièrement la minute, et gunicorn est déjà réglé sur
        # --timeout 600 (voir backend/Dockerfile). Laisser le défaut ferait
        # couper par nginx une requête que le backend traite encore : côté
        # navigateur, une erreur 504 sans explication, au milieu d'une
        # génération qui allait aboutir.
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;

        # Aucun add_header ici : d'après la règle d'héritage rappelée plus bas,
        # un bloc qui n'en déclare AUCUN hérite de ceux du niveau « server ».
        # Les en-têtes de sécurité s'appliquent donc aussi aux réponses de l'API.
    }

    # Repli pour application monopage.
    #
    # Vue Router utilise l'historique du navigateur : /documents/42 est une route
    # CLIENTE, aucun fichier ne porte ce nom. Sans cette ligne, nginx renvoie 404
    # dès qu'on recharge la page ou qu'on ouvre un lien direct — l'application
    # ne fonctionne qu'en navigation interne, ce qui se remarque tard.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ATTENTION À UNE RÈGLE D'HÉRITAGE DE NGINX, vérifiée sur conteneur lancé.
    #
    # Les `add_header` d'un niveau ne sont hérités que si le niveau courant n'en
    # déclare AUCUN. Dès qu'un bloc `location` ajoute un en-tête, il perd tous
    # ceux du bloc `server`. Les en-têtes de sécurité ci-dessous disparaissaient
    # ainsi de la réponse sur / et sur les fichiers de /assets/ — c'est-à-dire
    # sur toutes les pages réellement servies.
    #
    # Ils sont donc répétés dans chaque bloc qui déclare un en-tête. Dupliquer
    # est ici la correction, pas un oubli de factorisation.

    # Les fichiers produits par Vite portent une empreinte dans leur nom
    # (index-DI3XYKwO.css) : leur contenu ne change jamais sous un même nom, ils
    # peuvent donc être mis en cache indéfiniment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html, lui, ne doit JAMAIS être mis en cache : c'est lui qui désigne
    # les fichiers empreintés. S'il est gardé, le navigateur continue de demander
    # l'ancienne version du site après un déploiement.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # En-têtes de sécurité élémentaires. Pas de Content-Security-Policy ici :
    # elle demande un inventaire précis des sources autorisées, qui dépasse la
    # mise en conteneur et figure dans la TODO.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
