<text x="176" y="730" font-size="8.8" fill="#8795a1">Les cas UC-17 et UC-18 ne sont jamais déclenchés directement : ils sont inclus par les cas qui en dépendent. UC-18 est également inclus par UC-05, UC-07 et UC-09.</text>
<text x="176" y="746" font-size="8.8" fill="#8795a1">Le cas UC-10, encadré en rouge, est la fonctionnalité la plus représentative du projet : il traverse les quatre couches de l'architecture.</text>
