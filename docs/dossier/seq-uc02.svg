<svg viewBox="0 0 1040 652" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
<defs><marker id="s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3c56"/></marker><marker id="s2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,2 L10,5 L0,8" fill="none" stroke="#44525f" stroke-width="1.3"/></marker><marker id="s3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b8341c"/></marker></defs>
<rect x="25" y="40" width="150" height="38" rx="4" fill="#1f3c56"/>
<text x="100" y="56" font-size="9.6" font-weight="600" fill="#fff" text-anchor="middle">Utilisateur</text>
<text x="100" y="69" font-size="8.1" fill="#b9c8d6" text-anchor="middle">acteur</text>
<line x1="100" y1="78" x2="100" y2="626" stroke="#aebbc6" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="235" y="40" width="150" height="38" rx="4" fill="#1f3c56"/>
<text x="310" y="56" font-size="9.6" font-weight="600" fill="#fff" text-anchor="middle">Client</text>
<text x="310" y="69" font-size="8.1" fill="#b9c8d6" text-anchor="middle">couche présentation</text>
<line x1="310" y1="78" x2="310" y2="626" stroke="#aebbc6" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="485" y="40" width="150" height="38" rx="4" fill="#1f3c56"/>
<text x="560" y="56" font-size="9.6" font-weight="600" fill="#fff" text-anchor="middle">Contrôleur d'authentification</text>
<text x="560" y="69" font-size="8.1" fill="#b9c8d6" text-anchor="middle">couche contrôleur</text>
<line x1="560" y1="78" x2="560" y2="626" stroke="#aebbc6" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="715" y="40" width="150" height="38" rx="4" fill="#1f3c56"/>
<text x="790" y="56" font-size="9.6" font-weight="600" fill="#fff" text-anchor="middle">Service d'authentification</text>
<text x="790" y="69" font-size="8.1" fill="#b9c8d6" text-anchor="middle">couche métier</text>
<line x1="790" y1="78" x2="790" y2="626" stroke="#aebbc6" stroke-width="1" stroke-dasharray="4 4"/>
<rect x="890" y="40" width="150" height="38" rx="4" fill="#1f3c56"/>
<text x="965" y="56" font-size="9.6" font-weight="600" fill="#fff" text-anchor="middle">Base de données</text>
<text x="965" y="69" font-size="8.1" fill="#b9c8d6" text-anchor="middle">couche d'accès</text>
<line x1="965" y1="78" x2="965" y2="626" stroke="#aebbc6" stroke-width="1" stroke-dasharray="4 4"/>
<line x1="100" y1="96" x2="310" y2="96" stroke="#1f3c56" stroke-width="1.2" marker-end="url(#s1)"/>
<text x="205" y="91" font-size="8.6" fill="#16202b" text-anchor="middle">saisit son adresse et son mot de passe</text>
<line x1="310" y1="122" x2="560" y2="122" stroke="#1f3c56" stroke-width="1.2" marker-end="url(#s1)"/>
<text x="435" y="117" font-size="8.6" fill="#16202b" text-anchor="middle">POST /auth/login</text>
<line x1="560" y1="148" x2="965" y2="148" stroke="#1f3c56" stroke-width="1.2" marker-end="url(#s1)"/>
<text x="762" y="143" font-size="8.6" fill="#16202b" text-anchor="middle">SELECT utilisateur par adresse</text>
<line x1="965" y1="174" x2="560" y2="174" stroke="#44525f" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#s2)"/>
<text x="762" y="169" font-size="8.6" fill="#44525f" text-anchor="middle">utilisateur, ou rien</text>
<line x1="560" y1="200" x2="790" y2="200" stroke="#1f3c56" stroke-width="1.2" marker-end="url(#s1)"/>
<text x="675" y="195" font-size="8.6" fill="#16202b" text-anchor="middle">vérifie le mot de passe contre l'empreinte bcrypt</text>
<line x1="790" y1="226" x2="560" y2="226" stroke="#44525f" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#s2)"/>
<text x="675" y="221" font-size="8.6" fill="#44525f" text-anchor="middle">vrai ou faux</text>
<line x1="560" y1="252" x2="310" y2="252" stroke="#b8341c" stroke-width="1.3" marker-end="url(#s3)"/>
<text x="435" y="247" font-size="8.6" fill="#b8341c" text-anchor="middle">401 « Email ou mot de passe incorrect » — message indifférencié</text>
<line x1="560" y1="278" x2="790" y2="278" stroke="#1f3c56" stroke-width="1.2" marker-end="url(#s1)"/>
<text x="675" y="273" font-size="8.6" fill="#16202b" text-anchor="middle">émet un jeton d'accès de 15 minutes</text>
<line x1="560" y1="304" x2="790" y2="304" stroke="#1f3c56" stroke-width="1.2" marker-end="url(#s1)"/>
<text x="675" y="299" font-size="8.6" fill="#16202b" text-anchor="middle">ouvre une session</text>
<line x1="790" y1="330" x2="965" y2="330" stroke="#1f3c56" stroke-width="1.2" marker-end="url(#s1)"/>
<text x="877" y="325" font-size="8.6" fill="#16202b" text-anchor="middle">INSERT session — empreinte du jeton de rafraîchissement</text>
<line x1="790" y1="356" x2="560" y2="356" stroke="#44525f" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#s2)"/>
<text x="675" y="351" font-size="8.6" fill="#44525f" text-anchor="middle">jeton de rafraîchissement en clair</text>
<line x1="560" y1="382" x2="310" y2="382" stroke="#44525f" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#s2)"/>
<text x="435" y="377" font-size="8.6" fill="#44525f" text-anchor="middle">200 — jeton d'accès, et témoin HttpOnly SameSite=Strict Path=/auth</text>
<path d="M310,400 L344,400 L344,412 L312,412" fill="none" stroke="#1f3c56" stroke-width="1.2" marker-end="url(#s1)"/>
<text x="352" y="410" font-size="8.6" fill="#16202b">conserve le jeton d'accès en mémoire, jamais dans le stockage du navigateur</text>
<line x1="310" y1="434" x2="560" y2="434" stroke="#1f3c56" stroke-width="1.2" marker-end="url(#s1)"/>
<text x="435" y="429" font-size="8.6" fill="#16202b" text-anchor="middle">POST /auth/refresh — témoin de connexion, 15 minutes plus tard</text>
<line x1="560" y1="460" x2="790" y2="460" stroke="#1f3c56" stroke-width="1.2" marker-end="url(#s1)"/>
<text x="675" y="455" font-size="8.6" fill="#16202b" text-anchor="middle">renouvelle le jeton de rafraîchissement</text>
<line x1="790" y1="486" x2="965" y2="486" stroke="#1f3c56" stroke-width="1.2" marker-end="url(#s1)"/>
<text x="877" y="481" font-size="8.6" fill="#16202b" text-anchor="middle">SELECT session par empreinte</text>
<line x1="790" y1="512" x2="560" y2="512" stroke="#b8341c" stroke-width="1.3" marker-end="url(#s3)"/>
<text x="675" y="507" font-size="8.6" fill="#b8341c" text-anchor="middle">401 et révocation de toutes les sessions si le jeton a déjà servi</text>
<line x1="790" y1="538" x2="965" y2="538" stroke="#1f3c56" stroke-width="1.2" marker-end="url(#s1)"/>
<text x="877" y="533" font-size="8.6" fill="#16202b" text-anchor="middle">révoque l'ancienne session, insère la nouvelle</text>
<line x1="790" y1="564" x2="560" y2="564" stroke="#44525f" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#s2)"/>
<text x="675" y="559" font-size="8.6" fill="#44525f" text-anchor="middle">nouveau jeton de rafraîchissement</text>
<line x1="560" y1="590" x2="310" y2="590" stroke="#44525f" stroke-width="1.1" stroke-dasharray="5 3" marker-end="url(#s2)"/>
<text x="435" y="585" font-size="8.6" fill="#44525f" text-anchor="middle">200 — nouveau jeton d'accès et nouveau témoin</text>
</svg>