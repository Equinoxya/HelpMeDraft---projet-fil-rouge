<svg viewBox="0 0 980 430" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">
  <!--
    Architecture logicielle — lecture de gauche à droite.

    La version précédente empilait trois colonnes reliées par des flèches qui
    se croisaient : on ne voyait pas quelle couche appelait quel service. Ici
    chaque dépendance est posée à la hauteur de la couche qui l'appelle, le
    chemin d'une requête se suit en trois temps numérotés, et chaque bloc tient
    en deux lignes — la troisième, en brique, porte le point à retenir.
  -->
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
    <marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#C4341C"/>
    </marker>
  </defs>

  <style>
    .zone  { fill:#F4F1EA; stroke:#CFC9BC; stroke-width:1 }
    .ztit  { font-size:10px; font-weight:700; fill:#5A554C; letter-spacing:1.3px }
    .boite { fill:#FFFFFF; stroke:#111111; stroke-width:1.1 }
    .titre { font-size:11.5px; font-weight:700; fill:#111111 }
    .corps { font-size:8.8px; fill:#44474A }
    .cle   { font-size:8.8px; fill:#C4341C; font-weight:600 }
    .num   { font-size:9.5px; font-weight:700; fill:#FFFFFF }
    .lab   { font-size:8.8px; fill:#5A554C }
    .pied  { font-size:10.5px; fill:#111111 }
  </style>

  <!-- ─────────────── zones ─────────────── -->
  <rect class="zone" x="16"  y="34" width="218" height="340" rx="4"/>
  <text class="ztit" x="28"  y="53">NAVIGATEUR</text>

  <rect class="zone" x="306" y="34" width="330" height="340" rx="4"/>
  <text class="ztit" x="318" y="53">API — FLASK</text>

  <rect class="zone" x="708" y="34" width="256" height="340" rx="4"/>
  <text class="ztit" x="720" y="53">DÉPENDANCES</text>

  <!-- ─────────────── navigateur ─────────────── -->
  <rect class="boite" x="30" y="70" width="190" height="62" rx="3"/>
  <text class="titre" x="43" y="90">Vue 3 · TypeScript</text>
  <text class="corps" x="43" y="106">Les 15 écrans.</text>
  <text class="corps" x="43" y="121">Routeur : trois gardes.</text>

  <rect class="boite" x="30" y="146" width="190" height="62" rx="3"/>
  <text class="titre" x="43" y="166">Pinia — la session</text>
  <text class="corps" x="43" y="182">Le jeton d'accès</text>
  <text class="cle"   x="43" y="197">reste en mémoire.</text>

  <rect class="boite" x="30" y="222" width="190" height="62" rx="3"/>
  <text class="titre" x="43" y="242">axios — les appels</text>
  <text class="corps" x="43" y="258">Un intercepteur unique.</text>
  <text class="corps" x="43" y="273">Rejoue après un 401.</text>

  <!-- ─────────────── 1 · navigateur → API ─────────────── -->
  <line x1="234" y1="101" x2="300" y2="101" stroke="#111111" stroke-width="1.6" marker-end="url(#fl)"/>
  <circle cx="243" cy="84" r="8" fill="#C4341C"/>
  <text class="num" x="243" y="87.5" text-anchor="middle">1</text>
  <text class="lab" x="255" y="87.5">HTTPS</text>

  <!-- ─────────────── les trois couches ─────────────── -->
  <rect class="boite" x="320" y="70" width="302" height="66" rx="3"/>
  <text class="titre" x="334" y="90">Routes</text>
  <text class="corps" x="334" y="106">Valide l'entrée, autorise, compte le quota.</text>
  <text class="cle"   x="334" y="124">Seule couche qui connaît HTTP.</text>

  <line x1="471" y1="136" x2="471" y2="174" stroke="#111111" stroke-width="1.6" marker-end="url(#fl)"/>
  <circle cx="453" cy="155" r="8" fill="#C4341C"/>
  <text class="num" x="453" y="158.5" text-anchor="middle">2</text>

  <rect class="boite" x="320" y="178" width="302" height="66" rx="3"/>
  <text class="titre" x="334" y="198">Services — les règles métier</text>
  <text class="corps" x="334" y="214">Mots de passe, jetons, prompts, courriels.</text>
  <text class="cle"   x="334" y="232">Aucun import Flask ici.</text>

  <line x1="471" y1="244" x2="471" y2="282" stroke="#111111" stroke-width="1.6" marker-end="url(#fl)"/>
  <circle cx="453" cy="263" r="8" fill="#C4341C"/>
  <text class="num" x="453" y="266.5" text-anchor="middle">3</text>

  <rect class="boite" x="320" y="286" width="302" height="66" rx="3"/>
  <text class="titre" x="334" y="306">Accès aux données</text>
  <text class="corps" x="334" y="322">SQLAlchemy — les 8 modèles.</text>
  <text class="cle"   x="334" y="340">Requêtes paramétrées, sans exception.</text>

  <!-- ─────────────── dépendances, à hauteur de leur appelant ─────────────── -->
  <rect class="boite" x="722" y="166" width="228" height="58" rx="3"/>
  <text class="titre" x="736" y="186">Ollama</text>
  <text class="corps" x="736" y="202">Modèle qwen2.5:3b.</text>
  <text class="cle"   x="736" y="217">Sur la machine, non exposé.</text>

  <rect class="boite" x="722" y="238" width="228" height="48" rx="3"/>
  <text class="titre" x="736" y="258">Serveur de courriel</text>
  <text class="corps" x="736" y="274">Réinitialisation du mot de passe.</text>

  <rect class="boite" x="722" y="300" width="228" height="48" rx="3"/>
  <text class="titre" x="736" y="320">MySQL 8.4</text>
  <text class="corps" x="736" y="336">Les 8 tables applicatives.</text>

  <!-- Services → Ollama et courriel ; données → MySQL. Aucun croisement. -->
  <path d="M622 203 L672 203 L672 195 L716 195" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#fl)"/>
  <path d="M622 226 L672 226 L672 262 L716 262" fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#fl)"/>
  <line x1="622" y1="324" x2="716" y2="324" stroke="#111111" stroke-width="1.4" marker-end="url(#fl)"/>

  <!-- ─────────────── ce qui ne se produit jamais ─────────────── -->
  <path d="M125 290 L125 392 L836 392 L836 354" fill="none" stroke="#C4341C" stroke-width="1.2"
        stroke-dasharray="5 4" marker-end="url(#flr)"/>
  <rect x="300" y="382" width="330" height="20" fill="#F4F1EA"/>
  <text x="310" y="396" font-size="9.8" font-weight="700" fill="#C4341C">✕ jamais : le navigateur n'atteint ni la base ni Ollama</text>

  <text class="pied" x="16" y="421">Tout passe par l'API, qui authentifie, vérifie la propriété du document et compte le quota avant d'appeler quoi que ce soit.</text>
</svg>
